                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected error (generic body, requestId only)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: Audit trail (newest first)
      tags:
        - audit
      description: "Authorisation: global capability audit.read"
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
            minLength: 1
            maxLength: 512
            description: Opaque cursor from a previous page's nextCursor
        - in: query
          name: limit
          schema:
            default: 50
            description: Page size (max 100, API-4)
            type: integer
            minimum: 1
            maximum: 100
          description: Page size (max 100, API-4)
        - in: query
          name: jobId
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: UUID identifier
            example: 0f8fad5b-d9cb-469f-a165-70867728950e
        - in: query
          name: actorId
          schema:
            type: string
            format: uuid
            pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            description: UUID identifier
            example: 0f8fad5b-d9cb-469f-a165-70867728950e
        - in: query
          name: action
          schema:
            type: string
            maxLength: 80
        - in: query
          name: from
          schema:
            description: First Perth business date, inclusive
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            example: 2026-06-14
          description: First Perth business date, inclusive
        - in: query
          name: to
          schema:
            description: Last Perth business date, inclusive
            type: string
            format: date
            pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
            example: 2026-06-14
          description: Last Perth business date, inclusive
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        "400":
          description: Validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: No valid session
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Authenticated but not allowed, or CSRF token missing/invalid
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Rate limited
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          description: Unexpected error (generic body, requestId only)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    GlobalRole:
      type: string
      enum:
        - admin
        - kr_admin
        - staff
        - external
      description: "admin: everything incl. user management; kr_admin: staff + fee
        proposals + audit; staff: all jobs; external: only jobs granted to them"
    UpdateUserRequest:
      type: object
      properties:
        role:
