    UserStatus:
      type: string
      enum:
        - active
        - disabled
    JobStatusFilter:
      type: string
      enum:
        - in_progress
        - complete
        - all
    SubdivisionType:
      type: string
      enum:
        - Survey-Strata
        - Built Strata
        - Amalgamation
        - Freehold
        - Strata Conversion
        - Re-Subdivision
    CreateJobRequest:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9][A-Za-z0-9 ./-]*$
          description: KR job number, unique among active jobs (case-insensitive)
          example: S-0001
        address:
          type: string
          minLength: 1
          maxLength: 200
        clientName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
        subdivisionType:
          $ref: "#/components/schemas/SubdivisionType"
      required:
        - jobNumber
        - address
        - subdivisionType
      additionalProperties: false
    UpdateJobRequest:
      type: object
      properties:
        jobNumber:
          type: string
          minLength: 1
          maxLength: 32
          pattern: ^[A-Za-z0-9][A-Za-z0-9 ./-]*$
          description: KR job number, unique among active jobs (case-insensitive)
          example: S-0001
        address:
          type: string
          minLength: 1
          maxLength: 200
        clientName:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
        subdivisionType:
          $ref: "#/components/schemas/SubdivisionType"
        approvalDate:
          anyOf:
            - type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              description: Calendar date (yyyy-mm-dd), Australia/Perth business date
              example: 2026-06-14
            - type: "null"
        approvalExpiry:
          anyOf:
            - type: string
              format: date
              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
              description: Calendar date (yyyy-mm-dd), Australia/Perth business date
              example: 2026-06-14
            - type: "null"
        conformedDate:
