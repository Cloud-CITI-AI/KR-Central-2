# Playbook templates/project/.github/workflows/ci.yml, calling the vendored reusable workflow (ADR-0013).
# Required check names (org ruleset): "ci / verify", "ci / pr-size"
name: ci
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: ./.github/workflows/reusable-ci-node.yml
    permissions:
      contents: read
    with:
      # Every workspace package must be listed (scripts/ci/check-ci-matrix.mjs fails `pnpm lint` otherwise).
      packages: '["packages/workflow","packages/contracts","packages/design-tokens","packages/config","packages/logger","packages/telemetry","packages/db","packages/document-parsing","packages/storage","packages/mock-idp","services/api","services/worker","services/ops","apps/web"]'
      e2e-packages: '["apps/web"]'
      node-version: "24"
      diff-coverage-min: 80
      mutation-break: 60

  api-contract:
    # API-1/API-2: openapi.yaml is generated from the zod contract and must not break consumers silently.
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: openapi.yaml is up to date
        run: pnpm openapi:check
      - name: No breaking changes (oasdiff)
        if: github.event_name == 'pull_request'
        env: { BASE_REF: "${{ github.base_ref }}" }
        run: |
          git show "origin/${BASE_REF}:packages/contracts/openapi.yaml" > /tmp/base-openapi.yaml 2>/dev/null || { echo "No base spec yet"; exit 0; }
          docker run --rm -v /tmp:/base -v "$PWD/packages/contracts:/head" tufin/oasdiff:v1.32.1@sha256:3b14fe0112e5d1bf862f91ab234a4bcd161a3f399e98f8b0b665ce70857694ac breaking /base/base-openapi.yaml /head/openapi.yaml --fail-on ERR

  format:
    # Prettier over the whole repo (docs, workflows, JSON included) — package lint does not cover these files.
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - name: Work package plan is consistent (owned paths, waves, required brief sections)
        run: node scripts/plan/check-work-packages.mjs

  infra:
    # ADR-0008: the Railway pipeline/docs guards, the ClamAV image's entrypoint and the infra checks run on every PR, not
    # only after a release is tagged. Node built-ins only (infra/ is not a workspace package), so no install is needed;
    # Docker (preinstalled) answers `docker compose config` for the stack test.
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - run: pnpm test:infra

  images:
    # Every Dockerfile builds before a release is cut (release.yml first builds and pushes them after tagging). Nothing
    # is pushed or attested here (push: false); infra/test/ci-wiring.test.mjs keeps this list equal to the repo's Dockerfiles.
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: apps/web/Dockerfile
          - dockerfile: infra/clamav/Dockerfile
          - dockerfile: packages/mock-idp/Dockerfile
          - dockerfile: services/api/Dockerfile
          - dockerfile: services/ops/Dockerfile
          - dockerfile: services/worker/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build ${{ matrix.dockerfile }} (not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          provenance: false

  pr-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Enforce PR size (N3)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash scripts/playbook/check-pr-size.sh

  verify:
    if: always()
    needs: [node, api-contract, format, infra, images, pr-size]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: All CI jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then exit 1; fi
          done
