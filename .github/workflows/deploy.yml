# Playbook templates/project/.github/workflows/deploy.yml adapted for Railway (ADR-0008).
# Promotion: staging (automatic after release.yml has built and attested every image) -> production (GitHub
# Environment "production" approval).
#
# Triggering: release.yml CALLS this workflow (workflow_call) after `build-and-attest`, because a release created with
# GITHUB_TOKEN never fires `release: published` for other workflows — and the image digests are uploaded only after the
# release exists. workflow_dispatch remains for manual redeploys/rollbacks of an existing tag.
#
# Railway has no OIDC federation: RAILWAY_TOKEN is a per-environment *project token* stored as a GitHub Environment
# secret (required reviewers, 90-day rotation — SE-2 exception recorded in ADR-0008).
# Railway has no traffic-splitting canary: progressive delivery = OpenFeature flags + health-checked deploys +
# automatic rollback to the previous image digests (N9 exception in ADR-0008).
#
# Service order (ADR-0008): clamav -> migrate (backup + migrations as tracker_migrator; healthy only after success)
# -> api -> worker -> web -> backup. deploy-images.mjs deploys them sequentially and waits for each to be healthy, so
# new worker/web code never runs against the old schema and the api never holds DDL credentials (ADR-0007).
name: deploy
on:
  workflow_call:
    inputs:
      tag: { type: string, required: true, description: "Release tag whose attested image digests are deployed" }
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to deploy", required: true }
permissions: {}
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  SERVICES: "clamav migrate api worker web backup"

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 200 # deploy 75 + rollback 75 + verify, smoke and ZAP (pipeline.test.mjs checks the sum)
    permissions: { contents: read, attestations: read, packages: read }
    steps:
      - name: Kill-switch check
        if: vars.DEPLOYS_FROZEN == 'true'
        run: |
          echo "Deploys are frozen (vars.DEPLOYS_FROZEN)"
          exit 1
      - name: Validate the tag (a release tag vX.Y.Z; nothing else reaches checkout)
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1; }
      # The tag's own scripts and service settings, not the dispatching branch's: a redeploy or rollback of an old tag
      # applies exactly what that tag shipped, not main's newer infra/railway/* with the old images.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "refs/tags/${{ inputs.tag }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - name: Log in to GHCR (private images; needed to read attestations from the registry)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests from the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "$TAG" -p 'image-*.txt' -R "${{ github.repository }}"
      - name: Verify provenance of every image before deploying (N8)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          for f in image-*.txt; do
            gh attestation verify "oci://$(cat "$f")" -R "${{ github.repository }}"
          done
      - name: Deploy by digest, in order, waiting for each service to be healthy
        timeout-minutes: 75 # worst case: 65 min of scripted waits (healthWaitSeconds per service)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: staging
        run: node infra/railway/scripts/deploy-images.mjs --environment staging --services "$SERVICES" --record previous-staging.json
      - name: Smoke tests (health, readiness through the BFF, sign-in page, security headers, latency probe)
        env: { BASE_URL: "${{ vars.STAGING_URL }}" }
        run: node infra/railway/scripts/smoke.mjs --base-url "$BASE_URL"
      - name: DAST baseline (OWASP ZAP)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: ${{ vars.STAGING_URL }}
          rules_file_name: infra/zap/rules.tsv
          fail_action: true
          allow_issue_writing: false
      - name: Roll back staging on failure or cancellation (a step timeout is a failure, a job timeout a cancellation)
        if: failure() || cancelled()
        timeout-minutes: 75
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: staging
        run: |
          [ -f previous-staging.json ] || { echo "No previous deployment recorded; nothing to roll back"; exit 0; }
          node infra/railway/scripts/deploy-images.mjs --environment staging --rollback previous-staging.json

  production:
    needs: staging
    runs-on: ubuntu-latest
    environment: production # required reviewers configured on the environment; agents are never reviewers
    timeout-minutes: 200 # deploy 75 + rollback 75 + verify, smoke and ZAP (pipeline.test.mjs checks the sum)
    permissions: { contents: read, attestations: read, packages: read, deployments: write }
    steps:
      - name: Kill-switch check
        if: vars.DEPLOYS_FROZEN == 'true'
        run: |
          echo "Deploys are frozen (vars.DEPLOYS_FROZEN)"
          exit 1
      - name: Validate the tag (a release tag vX.Y.Z; nothing else reaches checkout)
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$TAG' is not a release tag (vX.Y.Z)"; exit 1; }
      # The tag's own scripts and service settings, not the dispatching branch's: a redeploy or rollback of an old tag
      # applies exactly what that tag shipped, not main's newer infra/railway/* with the old images.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: "refs/tags/${{ inputs.tag }}", persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "24" }
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download and verify image digests
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release download "$TAG" -p 'image-*.txt' -R "${{ github.repository }}"
          for f in image-*.txt; do gh attestation verify "oci://$(cat "$f")" -R "${{ github.repository }}"; done
      - name: Deploy by digest (migrate takes a pg_dump to the backup bucket before applying pending migrations)
        timeout-minutes: 75 # worst case: 65 min of scripted waits (healthWaitSeconds per service)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
        run: node infra/railway/scripts/deploy-images.mjs --environment production --services "$SERVICES" --record previous-production.json
      - name: Post-deploy smoke watch (10 min; health, headers and a latency probe against budgets — no metrics backend yet)
        env: { BASE_URL: "${{ vars.PRODUCTION_URL }}" }
        run: node infra/railway/scripts/smoke.mjs --base-url "$BASE_URL" --watch-minutes 10
      - name: Automatic rollback on failure or cancellation (previous image digests; no down-migrations, expand/contract only)
        if: failure() || cancelled()
        timeout-minutes: 75
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT: production
        run: |
          [ -f previous-production.json ] || { echo "No previous deployment recorded; nothing to roll back"; exit 0; }
          node infra/railway/scripts/deploy-images.mjs --environment production --rollback previous-production.json
