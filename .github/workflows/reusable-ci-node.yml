# Vendored from agentic-playbook v1.0.0 .github/workflows/reusable-ci-node.yml (ADR-0013: no org playbook repo yet),
# adapted for a pnpm workspace: install once at the repo root, build workspace dependencies, then run the package's
# required scripts. Actions are pinned by full SHA (N8).
name: reusable-ci-node
on:
  workflow_call:
    inputs:
      packages: { type: string, required: true, description: "JSON array of package dirs" }
      e2e-packages: { type: string, required: false, default: "[]" }
      node-version: { type: string, required: false, default: "24" }
      diff-coverage-min: { type: number, required: false, default: 80 }
      mutation-break: { type: number, required: false, default: 60 }
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(inputs.packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ inputs.node-version }}", cache: pnpm }
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies of the package
        env: { PKG: "${{ matrix.pkg }}" }
        run: pnpm --filter "{./${PKG}}^..." build
      - name: Lint
        working-directory: ${{ matrix.pkg }}
        run: pnpm lint
      - name: Typecheck
        working-directory: ${{ matrix.pkg }}
        run: pnpm typecheck
      - name: Unit tests
        working-directory: ${{ matrix.pkg }}
        run: pnpm test:unit
      - name: Integration tests (Testcontainers; Docker is available on ubuntu-latest)
        working-directory: ${{ matrix.pkg }}
        run: pnpm test:integration
      - name: Contract tests
        working-directory: ${{ matrix.pkg }}
        run: pnpm run --if-present test:contract
      - name: Diff coverage
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.pkg }}
        env:
          BASE_REF: ${{ github.base_ref }}
          MIN: ${{ inputs.diff-coverage-min }}
          DIFF_COVER_VERSION: "10.5.1"
        run: |
          pipx install "diff-cover==${DIFF_COVER_VERSION}" >/dev/null
          # Unit, integration and contract runs each write coverage/<layer>/cobertura-coverage.xml. diff-cover treats a
          # line as covered when ANY report covers it, so handlers/repositories tested only by integration tests count.
          reports=$(find coverage -name 'cobertura-coverage.xml' 2>/dev/null || true)
          if [ -z "$reports" ]; then echo "No coverage report (package has no tests yet)"; exit 0; fi
          echo "Coverage reports: $reports"
          diff-cover $reports --compare-branch="origin/$BASE_REF" --fail-under="$MIN"
      - name: Restore Stryker incremental cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ matrix.pkg }}/.stryker-tmp/incremental.json
          key: stryker-${{ matrix.pkg }}-${{ github.base_ref }}
      - name: Mutation testing on changed files
        if: github.event_name == 'pull_request'
        working-directory: ${{ matrix.pkg }}
        env:
          BASE_REF: ${{ github.base_ref }}
          PKG: ${{ matrix.pkg }}
          BREAK: ${{ inputs.mutation-break }}
        run: |
          changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . | grep -E '\.(ts|tsx)$' | grep -vE '\.(test|spec|stories|int\.test|contract\.test)\.' | sed "s#^$PKG/##" || true)
          # --mutate replaces the config's globs, so keep only files the package's stryker.config.mjs would mutate.
          # shellcheck disable=SC2086
          files=$(node "$GITHUB_WORKSPACE/scripts/ci/mutation-targets.mjs" . $changed)
          if [ -z "$files" ]; then echo "No changed files in this package's mutate globs; skipping mutation."; exit 0; fi
          echo "Mutating: $files"
          pnpm exec stryker run --incremental --mutate "$files" --thresholds.break "$BREAK"
      - name: Build
        working-directory: ${{ matrix.pkg }}
        run: pnpm build
      - name: Performance budgets (if the package defines them)
        working-directory: ${{ matrix.pkg }}
        run: pnpm run --if-present perf:check
      - name: Performance script unit tests (if the package defines them)
        working-directory: ${{ matrix.pkg }}
        run: pnpm run --if-present perf:unit

  e2e:
    if: inputs.e2e-packages != '[]'
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read }
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        pkg: ${{ fromJSON(inputs.e2e-packages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "${{ inputs.node-version }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build everything the e2e stack needs (packages, api, worker, web)
        run: pnpm build
      - working-directory: ${{ matrix.pkg }}
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and visual tests (starts Postgres, S3 mock, API with fake IdP, web)
        working-directory: ${{ matrix.pkg }}
        run: pnpm test:e2e
      # WP-22: each perf config starts its own synthetic stack (workers=1, retries=0) and runs after the functional suite so
      # its CPU/network throttling and load never overlap it. Both are no-ops for a package without the scripts.
      - name: Web vitals on the reference profile (LCP, CLS, INP proxy; if the package defines them)
        working-directory: ${{ matrix.pkg }}
        run: pnpm run --if-present perf:vitals
      - name: k6 API smoke against the e2e stack (if the package defines it)
        working-directory: ${{ matrix.pkg }}
        env:
          K6_IMAGE: "mirror.gcr.io/grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34"
        run: pnpm run --if-present perf:k6
      - name: Report flaky tests (passed on retry)
        if: always()
        working-directory: ${{ matrix.pkg }}
        run: |
          f=test-results/results.json
          [ -f "$f" ] || exit 0
          python3 - "$f" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          flaky=[]
          def walk(s):
              for sp in s.get("specs",[]):
                  for t in sp.get("tests",[]):
                      if t.get("status")=="flaky": flaky.append(sp["title"])
              for c in s.get("suites",[]): walk(c)
          for s in r.get("suites",[]): walk(s)
          for t in flaky: print(f"::warning::Flaky test (passed on retry): {t} — quarantine within 24h (docs/06 §6.5)")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          {
            name: "playwright-report-${{ strategy.job-index }}",
            path: "${{ matrix.pkg }}/playwright-report\n${{ matrix.pkg }}/test-results/perf\n${{ matrix.pkg }}/test-results/perf-k6",
            retention-days: 14,
          }
