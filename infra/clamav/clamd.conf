# clamd configuration for the KR Subdivision Tracker (ADR-0011). Replaces the image's /etc/clamav/clamd.conf.

# Network: the worker connects over TCP (Railway private network is IPv6; `::` also accepts IPv4 on a dual-stack host).
# `::` is the default; the image entrypoint (kr-entrypoint.sh) rewrites this one line from CLAMD_TCP_ADDR, for Docker hosts
# without IPv6 (0.0.0.0). Keep exactly one TCPAddr line: clamd binds every one it finds.
TCPSocket 3310
TCPAddr ::
# The upstream /init waits for a local socket before it reports clamd as started; keep one (not reachable from outside).
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
User clamav

# Logs to the console (Railway captures it): no LogFile, because clamd cannot open /dev/stdout (symlink check).
LogTime yes
LogClean no
LogVerbose no
Foreground yes

# Size limits: all above UPLOAD_MAX_BYTES (50 MB default, worker config refuses CLAMAV_STREAM_MAX_BYTES below it).
# StreamMaxLength is what INSTREAM enforces (the worker sets CLAMAV_STREAM_MAX_BYTES = 62914560 = 60M to match).
# MaxFileSize caps one scanned file (a larger file is skipped, not reported clean by clamd's own policy), MaxScanSize caps
# the total bytes scanned including archive contents (decompression bombs stop here).
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 240M
