# clamd configuration for the KR Subdivision Tracker (ADR-0011). Replaces the image's /etc/clamav/clamd.conf.

# Network: the worker connects over TCP (Railway private network is IPv6; `::` also accepts IPv4 on a dual-stack host).
# `::` is the default; the image entrypoint (kr-entrypoint.sh) rewrites this one line from CLAMD_TCP_ADDR, for Docker hosts
# without IPv6 (0.0.0.0). Keep exactly one TCPAddr line: clamd binds every one it finds.
TCPSocket 3310
TCPAddr ::
# The upstream /init waits for a local socket before it reports clamd as started; keep one (not reachable from outside).
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
User clamav

# Logs to the console (Railway captures it): no LogFile, because clamd cannot open /dev/stdout (symlink check).
LogTime yes
LogClean no
LogVerbose no
Foreground yes

# Size limits: all above UPLOAD_MAX_BYTES (50 MB default, worker config refuses CLAMAV_STREAM_MAX_BYTES below it).
# StreamMaxLength is what INSTREAM enforces (the worker sets CLAMAV_STREAM_MAX_BYTES = 62914560 = 60M to match): a longer
# stream is answered with "INSTREAM size limit exceeded. ERROR", which the worker records as a scan error, never clean.
# MaxFileSize caps one scanned file, MaxScanSize caps the total bytes scanned including archive contents, MaxRecursion
# caps how deep archives/PDF streams nest, MaxFiles caps the files inside one archive.
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 240M
MaxRecursion 17
MaxFiles 10000

# By default clamd silently stops at those four limits and answers "OK" for the part it skipped (a PDF nesting EICAR
# 17+ levels deep scanned "stream: OK"). AlertExceedsMax makes clamd answer "Heuristics.Limits.Exceeded.<limit> FOUND"
# instead, and the worker treats any FOUND as blocked: status `infected`, object deleted, content 409 (ADR-0011:
# nothing an external party uploads passes as clean because it hit a scan limit). Do not remove it, and do not raise
# the limits to hide a false positive without checking the README (Limits).
AlertExceedsMax yes
