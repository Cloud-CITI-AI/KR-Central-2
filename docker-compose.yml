# Local development stack (not used in Railway).
#
# Dependencies only (what `pnpm db:up` starts), then bootstrap and migrate from the workspace:
#   pnpm db:up && pnpm --filter @kr/db build && node packages/db/dist/bootstrap-cli.js && node packages/db/dist/migrate-cli.js
#
# The whole stack from the production images, built from this checkout (api, worker, web and the ops image that
# bootstraps the database roles and migrates, exactly as the Railway `migrate` service does):
#   docker compose --profile stack up --build        # web on http://localhost:3000, api on :8080
#   docker compose --profile stack down              # add -v to drop the database and signature volumes
# Values come from .env.example (fake). Only the host names change (localhost becomes the service name) and NODE_ENV,
# PORT and HOST are set per service.
#
# Sign-in uses the `mock-idp` service (packages/mock-idp, synthetic users, never built by the release workflow). The API
# (inside the compose network) and your browser (on the host) must use the SAME authority URL, because the API puts the
# authority's endpoints into the redirect it sends the browser to and checks the token issuer against it. That URL is
# http://mock-idp.localhost:4010: the service has this network alias, and browsers resolve *.localhost to 127.0.0.1 (if
# yours does not, add `127.0.0.1 mock-idp.localhost` to your hosts file). Open http://localhost:3000 and pick a user.
# Docker hosts whose kernel has no IPv6 cannot bind `::`: start with KR_STACK_HOST=0.0.0.0 in that case (it reaches
# api, worker, web, migrate and clamav, which reads it as CLAMD_TCP_ADDR).
#
# Every application service gets an explicit environment allowlist below, with the fake values of .env.example (only the
# host names differ: localhost becomes the service name). No service reads .env.example or `.env` wholesale, and none
# lists a variable as a bare key (`KEY:` means "take it from the shell or .env"), so the DDL, superuser and backup role
# credentials and the backup bucket keys reach only bootstrap, migrate and backup, however your shell or `.env` is set
# (ADR-0007, threat model M-23). A variable a service does not need is simply not listed. The schemas in
# packages/db, services/*/src/config.ts say what each service reads.

x-app-service: &app-service
  restart: "no"

# Shared by api and worker (both are tracker_app clients of the database and the files bucket).
x-app-environment: &app-environment
  NODE_ENV: production
  APP_ENV: local
  LOG_LEVEL: debug
  RELEASE_VERSION: dev
  HOST: ${KR_STACK_HOST:-::}
  DATABASE_URL: postgres://tracker_app:local-app-password@postgres:5432/tracker
  DATABASE_SSL: "false"
  S3_ENDPOINT: http://s3:9090
  S3_REGION: auto
  S3_BUCKET: tracker-files-local
  S3_ACCESS_KEY_ID: fake-access-key
  S3_SECRET_ACCESS_KEY: fake-secret-access-key
  S3_FORCE_PATH_STYLE: "true"
  UPLOAD_MAX_BYTES: "52428800"
  MALWARE_SCAN_MODE: disabled
  FEATURE_AI_STAMP_READING: "false"

# The sign-in settings the API and the mock IdP must agree on (the same values as .env.example). The worker does not
# sign anyone in and never holds them.
x-entra-environment: &entra-environment
  ENTRA_TENANT_ID: 00000000-0000-4000-8000-000000000001
  ENTRA_CLIENT_ID: 00000000-0000-4000-8000-000000000002
  ENTRA_CLIENT_SECRET: fake-client-secret-change-me

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tracker
      POSTGRES_PASSWORD: local-superuser-password
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker"]
      interval: 3s
      timeout: 3s
      retries: 20
  s3:
    # S3-compatible stand-in for Railway Buckets (adobe/s3mock: no auth, path-style): the files bucket and the backup bucket.
    image: adobe/s3mock:latest
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: tracker-files-local,tracker-backups-local
    ports: ["9090:9090"]
    # The mock takes a few seconds to listen; migrate's pre-migration backup needs it answering (ListBuckets).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/ > /dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30
  clamav:
    # The production ClamAV image (infra/clamav): limits above UPLOAD_MAX_BYTES. Loading signatures takes a minute or two.
    build: infra/clamav
    image: kr-clamav:local
    environment:
      # clamd binds this address (the image default is `::`, which an IPv4-only Docker host cannot bind): the same
      # KR_STACK_HOST=0.0.0.0 switch as the other services.
      CLAMD_TCP_ADDR: ${KR_STACK_HOST:-::}
    ports: ["3310:3310"]
    volumes: ["clamav-signatures:/var/lib/clamav"]
    # The image's own HEALTHCHECK (clamdcheck.sh: PING on 3310) turns healthy once the signatures are loaded; the worker waits for it.

  # ---------------------------------------------------------------- profile `stack`: the application images
  bootstrap:
    profiles: [stack]
    build: { context: ., dockerfile: services/ops/Dockerfile }
    image: kr-ops:local
    restart: "no"
    # One-off: creates the tracker_migrator, tracker_app and tracker_backup roles and the schema (the operator step of ADR-0007).
    command: ["node", "node_modules/@kr/db/dist/bootstrap-cli.js"]
    environment:
      SUPERUSER_DATABASE_URL: postgres://postgres:local-superuser-password@postgres:5432/tracker
      TRACKER_MIGRATOR_PASSWORD: local-migrator-password
      TRACKER_APP_PASSWORD: local-app-password
      # The same password as BACKUP_DATABASE_URL in .env.example (the stack has no backup service; the role must still exist).
      TRACKER_BACKUP_PASSWORD: local-backup-password
    depends_on:
      postgres: { condition: service_healthy }
  migrate:
    profiles: [stack]
    build: { context: ., dockerfile: services/ops/Dockerfile }
    image: kr-ops:local
    restart: "no"
    environment:
      APP_ENV: local
      LOG_LEVEL: debug
      HOST: ${KR_STACK_HOST:-::}
      PORT: "8082"
      MIGRATION_DATABASE_URL: postgres://tracker_migrator:local-migrator-password@postgres:5432/tracker
      BACKUP_S3_ENDPOINT: http://s3:9090
      BACKUP_S3_REGION: auto
      BACKUP_S3_BUCKET: tracker-backups-local
      BACKUP_S3_ACCESS_KEY_ID: fake-backup-access-key
      BACKUP_S3_SECRET_ACCESS_KEY: fake-backup-secret-access-key
      S3_FORCE_PATH_STYLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      bootstrap: { condition: service_completed_successfully }
      s3: { condition: service_healthy }
  mock-idp:
    profiles: [stack]
    build: { context: ., dockerfile: packages/mock-idp/Dockerfile }
    image: kr-mock-idp:local
    restart: "no"
    # Only the tenant, client id and secret (the same anchor as the API's, so the two always agree) and its own settings.
    environment:
      <<: *entra-environment
      MOCK_IDP_PUBLIC_URL: http://mock-idp.localhost:4010
    ports: ["4010:4010"]
    networks:
      default:
        aliases: [mock-idp.localhost]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:4010/$${ENTRA_TENANT_ID}/v2.0/.well-known/openid-configuration > /dev/null",
        ]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    <<: *app-service
    profiles: [stack]
    build: { context: ., dockerfile: services/api/Dockerfile }
    image: kr-api:local
    environment:
      <<: [*app-environment, *entra-environment]
      PORT: "8080"
      TRUST_PROXY_HOPS: "1"
      PUBLIC_BASE_URL: http://localhost:3000
      KR_STAFF_EMAIL_DOMAINS: krsurveys.com.au
      SESSION_IDLE_MINUTES: "120"
      SESSION_ABSOLUTE_HOURS: "12"
      LOG_PSEUDONYM_SALT: fake-log-salt-change-me
      REQUIRE_MFA_FOR_ADMIN: "false"
      ADMIN_MFA_EVIDENCE: amr
      DATABASE_POOL_MAX: "10"
      RATE_LIMIT_SIGNIN_PER_MINUTE_PER_IP: "20"
      RATE_LIMIT_WRITES_PER_MINUTE: "120"
      RATE_LIMIT_UPLOADS_PER_MINUTE: "30"
      RATE_LIMIT_READS_PER_MINUTE: "600"
      JSON_BODY_LIMIT_BYTES: "102400"
      FEATURE_ENTRA_GUEST_INVITES: "false"
      # The same URL the browser uses (see the top of this file).
      ENTRA_AUTHORITY_HOST: http://mock-idp.localhost:4010
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      migrate: { condition: service_healthy }
      mock-idp: { condition: service_healthy }
  worker:
    <<: *app-service
    profiles: [stack]
    build: { context: ., dockerfile: services/worker/Dockerfile }
    image: kr-worker:local
    environment:
      <<: *app-environment
      PORT: "8081"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CLAMAV_TIMEOUT_MS: "60000"
      CLAMAV_STREAM_MAX_BYTES: "62914560"
      SCAN_ERROR_MAX_RETRIES: "3"
      ANTHROPIC_MODEL: claude-sonnet-5-5
      ANTHROPIC_TIMEOUT_MS: "30000"
      WORKER_CONCURRENCY: "2"
      WORKER_POLL_INTERVAL_MS: "1000"
      WORKER_LEASE_SECONDS: "300"
      PDF_MAX_PAGES: "60"
    depends_on:
      migrate: { condition: service_healthy }
      clamav: { condition: service_healthy }
  web:
    profiles: [stack]
    restart: "no"
    build: { context: ., dockerfile: apps/web/Dockerfile }
    image: kr-web:local
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: ${KR_STACK_HOST:-::}
      PORT: "3000"
      API_INTERNAL_URL: http://api:8080
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata: {}
  clamav-signatures: {}
